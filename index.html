<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <!-- Защита страницы: скрипты, стили, картинки и запросы — только со своего адреса. Чужой или вставленный в страницу
       скрипт браузер не выполнит. 'unsafe-eval' нужен только затем, чтобы старые Safari разрешили распаковщик 3D-модели (WebAssembly). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self' blob: data: https://functions.yandexcloud.net https://*.apigw.yandexcloud.net; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Павел Немченко — продуктовый дизайнер</title>
  <meta name="description" content="Портфолио Павла Немченко: цифровые продукты, маркетинг и коммуникация, айдентика и брендинг.">
  <meta name="theme-color" content="#FFFFFF">
  <!-- карточка ссылки в мессенджерах и соцсетях; адрес картинки должен быть полным — поменяйте домен, если он другой -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Павел Немченко — продуктовый дизайнер">
  <meta property="og:description" content="Портфолио: цифровые продукты, маркетинг и коммуникация, айдентика и брендинг.">
  <meta property="og:image" content="https://pnemchenko.ru/assets/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="assets/favicon.png" type="image/png" sizes="96x96">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/narrow-cyrillic-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="content/site.json" as="fetch" crossorigin>
  <link rel="preload" href="content/projects.json" as="fetch" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <!-- части интерфейса: качаются сразу и одновременно, а не по цепочке «скрипт → его зависимости» -->
  <link rel="modulepreload" href="js/app.js">
  <link rel="modulepreload" href="js/content.js">
  <link rel="modulepreload" href="js/i18n.js">
  <link rel="modulepreload" href="js/lines.js">
  <link rel="modulepreload" href="js/folders.js">
  <link rel="modulepreload" href="js/theme.js">
  <link rel="modulepreload" href="js/catalog.js">
  <link rel="modulepreload" href="js/likes.js">
  <link rel="modulepreload" href="js/case.js">
  <link rel="modulepreload" href="js/burst.js">
  <link rel="modulepreload" href="js/subtitles.js">
  <link rel="modulepreload" href="js/voice.js">
  <link rel="modulepreload" href="js/model.js">
  <!-- 3D-голова подгружается после интерфейса; движок начинаем качать заранее. Саму модель и её загрузчики здесь
       не трогаем: их запускает js/app.js, когда движок уже скачан, — иначе они делят с ним канал, и на мобильной
       сети первым на экране появляется не мозг, а долгое ожидание -->
  <link rel="modulepreload" href="vendor/three/three.module.js">
  <link rel="modulepreload" href="js/head.js">
  <link rel="modulepreload" href="js/brain.js">
</head>
<body data-view="hero" data-tone="light">
  <a class="skip-link" href="#/work" data-t="skip">Сразу к работам</a>

  <!-- фон «в стиле проекта»: два слоя для плавной смены -->
  <div class="bg" data-bg aria-hidden="true"><div class="bg-layer"></div><div class="bg-layer"></div></div>

  <!-- логотип — отдельным слоем: на главной он лежит под головой (голова может его перекрывать), внутри сайта — в шапке -->
  <a class="logo" href="#/" data-logo aria-label="На главную"><span class="logo-mark" data-logo-mark></span></a>

  <header class="topbar" data-topbar>
    <div class="topbar-side" data-lang></div>
    <nav class="topnav" aria-label="Основное меню">
      <a class="btn" data-cv href="assets/cv.pdf" download>CV</a>
      <a class="btn" href="#/work" data-t="allWork">Все работы</a>
      <button class="btn btn--toggle" type="button" data-sound aria-pressed="false"><span data-t="sound">Звук</span></button>
    </nav>
  </header>

  <!-- работы из папок летят под головой: огибают её сзади, а не закрывают лицо -->
  <div class="burst" data-burst aria-hidden="true"></div>
  <div class="brainph" data-ph aria-hidden="true" hidden><i></i></div>
  <!-- пустышка для прежней версии скрипта: браузер вернувшегося посетителя может минуту держать её в памяти -->
  <div data-eyes aria-hidden="true" hidden></div>
  <div class="stage" id="stage" role="img" aria-label="Интерактивная 3D-голова. Её можно потянуть мышью или пальцем — она резиновая. Очки снимаются."></div>

  <!-- загрузка без процентов: пока 3D-голова качается, на месте мозга — розовое пятно, потом сам мозг (место им задаёт js/app.js),
       а когда модель готова, голова собирается по частям -->
  <div class="loader" data-loader role="status"><span class="visually-hidden" data-t="loader">Собираю лицо</span></div>

  <main id="main">
    <section class="hero" data-screen="hero" aria-labelledby="hero-title">
      <h1 id="hero-title" class="visually-hidden" tabindex="-1"><span data-name>Павел Немченко</span> — <span data-role>продуктовый дизайнер</span></h1>
      <nav class="folders" data-folders aria-label="Разделы портфолио"></nav>
    </section>

    <section class="catalog" data-screen="work" hidden aria-labelledby="work-title"></section>
    <article class="case" data-screen="case" hidden></article>
  </main>

  <footer class="site-footer">
    <span>© <span data-year>2026</span> <span data-name>Павел Немченко</span></span>
    <a data-email href="#" hidden></a>
    <a data-cv href="assets/cv.pdf" download data-t="downloadCv">Скачать резюме</a>
  </footer>

  <div class="veil" data-veil aria-hidden="true" hidden></div>

  <div class="subs" data-subs aria-hidden="true"></div>
  <p class="visually-hidden" data-subs-sr aria-live="polite"></p>

  <noscript><p class="noscript">Включите JavaScript, чтобы увидеть портфолио и поговорить с головой.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
